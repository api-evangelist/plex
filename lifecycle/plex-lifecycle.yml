deprecation:
  policy_url: https://developer.plex.tv/pms/#section/API-Info/API-Versioning
  policy: 'Breaking changes are gated behind the X-Plex-Pms-Api-Version header rather
    than announced as deprecations. Clients that do not send the header keep the
    unversioned 0.0 behaviour, which is how the September 2025 rename of
    includeFields to includeOptionalFields was shipped without breaking existing
    integrations. Plex publishes no dated deprecation calendar, no sunset window,
    and does not emit RFC 8594 Deprecation or Sunset response headers.'
  sunset_header: false
  deprecation_header: false
  breaking_changes_observed:
  - api: 1.0.0
    change: The includeFields parameter was renamed to includeOptionalFields.
      includeFields now means "include only these fields" where it previously meant
      "add these fields you would not normally include". Changed for consistency
      with the cloud provider API.
  - api: 1.1.0
    change: types in /playlists/{playlistId}/items changed to an array of integers.
