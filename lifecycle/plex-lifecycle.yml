  scheme: request-header
  header: X-Plex-Pms-Api-Version
  current: 1.2.2
  first_published: '1.0.0'
  default_when_absent: '0.0'
  docs: https://developer.plex.tv/pms/#section/API-Info/API-Versioning
  policy: 'PMS used no API versioning before this document existed. The first published
    API is considered 1.0 and everything prior 0.0. A client declares the version it
    expects via the X-Plex-Pms-Api-Version header; when no header is sent, 0.0 is
    assumed. Each API version is tied to a minimum Plex Media Server build.'
