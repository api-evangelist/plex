openapi: 3.2.0
info:
  title: Plex Media Server Download Queue API
  version: '1.2.2

    '
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  description: '# API Info

    ## Content Types

    The API supports responses in both XML and JSON, and clients can request one or the other using the standard `Accept` HTTP header.'
servers:
- url: https://{IP-description}.{identifier}.plex.direct:{port}
  variables:
    IP-description:
      default: 1-2-3-4
      description: A `-` separated string of the IPv4 or IPv6 address components
    identifier:
      default: 0123456789abcdef0123456789abcdef
      description: The unique identifier of this particular PMS
    port:
      default: '32400'
security:
- user_token:
  - shared user
  - admin
tags:
- name: Download Queue
paths:
  /downloadQueue:
    post:
      tags:
      - Download Queue
      operationId: downloadQueuePost
      summary: Get or create a download queue
      description: 'Available: 0.2.0


        Get or create a download queue for this client by its client id and for this user as identified by the token'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                properties:
                  MediaContainer:
                    allOf:
                    - $ref: '#/components/schemas/MediaContainer'
                    - type: object
                      properties:
                        DownloadQueue:
                          type: array
                          items:
                            type: object
                            properties:
                              id:
                                type: integer
                              status:
                                type: string
                                enum:
                                - deciding
                                - waiting
                                - processing
                                - done
                                - error
                                description: "The state of this queue\n  - deciding: At least one item is still being decided\n  - waiting: At least one item is waiting for transcode and none are currently transcoding\n  - processing: At least one item is being transcoded\n  - done: All items are available (or potentially expired)\n  - error: At least one item has encountered an error\n"
                              itemCount:
                                type: integer
              examples:
                empty:
                  value:
                    MediaContainer:
                      size: 1
                      DownloadQueue:
                      - id: 1
                        status: done
                        itemCount: 0
                processing:
                  value:
                    MediaContainer:
                      size: 1
                      DownloadQueue:
                      - id: 1
                        status: processing
                        itemCount: 32
  /downloadQueue/{queueId}:
    get:
      tags:
      - Download Queue
      operationId: downloadQueueGetQueue
      summary: Get a download queue
      description: 'Available: 0.2.0


        Get a download queue by its id'
      parameters:
      - in: path
        name: queueId
        schema:
          type: integer
        required: true
        description: The queue id
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                properties:
                  MediaContainer:
                    allOf:
                    - $ref: '#/components/schemas/MediaContainer'
                    - type: object
                      properties:
                        DownloadQueue:
                          type: array
                          items:
                            type: object
                            properties:
                              id:
                                type: integer
                              status:
                                type: string
                                enum:
                                - deciding
                                - waiting
                                - processing
                                - done
                                - error
                                description: "The state of this queue\n  - deciding: At least one item is still being decided\n  - waiting: At least one item is waiting for transcode and none are currently transcoding\n  - processing: At least one item is being transcoded\n  - done: All items are available (or potentially expired)\n  - error: At least one item has encountered an error\n"
                              itemCount:
                                type: integer
              examples:
                empty:
                  value:
                    MediaContainer:
                      size: 1
                      DownloadQueue:
                      - id: 1
                        status: done
                        itemCount: 0
                processing:
                  value:
                    MediaContainer:
                      size: 1
                      DownloadQueue:
                      - id: 1
                        status: processing
                        itemCount: 32
  /downloadQueue/{queueId}/add:
    post:
      tags:
      - Download Queue
      operationId: downloadQueuePostQueueAdd
      summary: Add to download queue
      description: 'Available: 0.2.0


        Add items to the download queue'
      parameters:
      - in: path
        name: queueId
        schema:
          type: integer
        required: true
        description: The queue id
      - in: query
        name: keys
        schema:
          type: array
          items:
            type: string
        explode: false
        required: true
        description: Keys to add
        example:
        - /library/metadata/3
        - /library/metadata/6
      - $ref: '#/components/parameters/2'
      - $ref: '#/components/parameters/3'
      - $ref: '#/components/parameters/4'
      - $ref: '#/components/parameters/5'
      - $ref: '#/components/parameters/6'
      - $ref: '#/components/parameters/7'
      - $ref: '#/components/parameters/8'
      - $ref: '#/components/parameters/9'
      - $ref: '#/components/parameters/10'
      - $ref: '#/components/parameters/11'
      - $ref: '#/components/parameters/12'
      - $ref: '#/components/parameters/13'
      - $ref: '#/components/parameters/14'
      - $ref: '#/components/parameters/15'
      - $ref: '#/components/parameters/16'
      - $ref: '#/components/parameters/17'
      - $ref: '#/components/parameters/18'
      - $ref: '#/components/parameters/19'
      - $ref: '#/components/parameters/20'
      - $ref: '#/components/parameters/21'
      - $ref: '#/components/parameters/22'
      - $ref: '#/components/parameters/23'
      - $ref: '#/components/parameters/24'
      - $ref: '#/components/parameters/25'
      - $ref: '#/components/parameters/26'
      - $ref: '#/components/parameters/27'
      - $ref: '#/components/parameters/28'
      - $ref: '#/components/parameters/29'
      - $ref: '#/components/parameters/30'
      - $ref: '#/components/parameters/31'
      - $ref: '#/components/parameters/32'
      - $ref: '#/components/parameters/33'
      - $ref: '#/components/parameters/34'
      - $ref: '#/components/parameters/35'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                properties:
                  MediaContainer:
                    allOf:
                    - $ref: '#/components/schemas/MediaContainer'
                    - type: object
                      properties:
                        AddedQueueItems:
                          type: array
                          items:
                            type: object
                            properties:
                              key:
                                type: string
                                description: The key added to the queue
                              id:
                                type: integer
                                description: The queue item id that was added or the existing one if an item already exists in this queue with the same parameters
              examples:
                addingOneItem:
                  value:
                    MediaContainer:
                      size: 1
                      AddedQueueItems:
                      - key: /library/metadata/146
                        id: 23
                      - key: /library/metadata/147
                        id: 24
  /downloadQueue/{queueId}/item/{itemId}/media:
    get:
      tags:
      - Download Queue
      operationId: downloadQueueGetQueueItemItemMedia
      summary: Grab download queue media
      description: 'Available: 0.2.0


        Grab the media for a download queue item'
      parameters:
      - in: path
        name: queueId
        schema:
          type: integer
        required: true
        description: The queue id
      - in: path
        name: itemId
        schema:
          type: integer
        example: 32
        required: true
        description: The item ids
      responses:
        '200':
          description: The raw media file
        '503':
          description: '![503](https://http.cat/503.jpg)


            The queue item is not yet complete and is currently transcoding or waiting to transcode

            '
          headers:
            Retry-After:
              schema:
                type: integer
              description: The estimated time before completion or -1 if unknown
