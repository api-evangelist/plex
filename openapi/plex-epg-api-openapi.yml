                        title: 365BLK
                        callSign: WGCECD
                        language: en
                      - id: 5fc76bd6d783b6002d898b76-5fc705db8aba71002d8b78ba
                        gridKey: 5fc76bd6d783b6002d898b76-5fc705db8aba71002d8b78ba
                        vcn: '6.2'
                        isHd: '1'
                        thumb: https://provider-static.plex.tv/1/epg/channels/logos/gracenote/1ebf2e8875465b8f318fbb137a400c27.png
                        title: Outlaw
                        callSign: WGCECD2
                        language: en
                      - id: 5fc76bd6d783b6002d898b76-5fc705db8aba71002d8b78b3
                        gridKey: 5fc76bd6d783b6002d898b76-5fc705db8aba71002d8b78b3
                        vcn: '6.3'
