openapi: 3.2.0
info:
  title: Plex Media Server EPG API
  version: '1.2.2

    '
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  description: '# API Info

    ## Content Types

    The API supports responses in both XML and JSON, and clients can request one or the other using the standard `Accept` HTTP header.'
servers:
- url: https://{IP-description}.{identifier}.plex.direct:{port}
  variables:
    IP-description:
      default: 1-2-3-4
      description: A `-` separated string of the IPv4 or IPv6 address components
    identifier:
      default: 0123456789abcdef0123456789abcdef
      description: The unique identifier of this particular PMS
    port:
      default: '32400'
security:
- user_token:
  - shared user
  - admin
tags:
- name: EPG
  description: The EPG (Electronic Program Guide) is responsible for obtaining metadata for what is airing on each channel and when
paths:
  /livetv/epg/channelmap:
    get:
      tags:
      - EPG
      summary: Compute the best channel map
      description: Compute the best channel map, given device and lineup
      operationId: livetvEpgGetChannelmap
      parameters:
      - in: query
        name: device
        schema:
          type: string
        required: true
        description: The URI describing the device
      - in: query
        name: lineup
        schema:
          type: string
        required: true
        description: The URI describing the lineup
      responses:
        '200':
          description: OK
          headers:
            X-Plex-Container-Total-Size:
              description: Provided on all MediaContainer objects indicating the total size of objects available
              schema:
                type: integer
            X-Plex-Container-Start:
              description: Provided on all MediaContainer objects indicating the offset of where this container page starts
              schema:
                type: integer
          content:
            application/json:
              schema:
                type: object
                properties:
                  MediaContainer:
                    allOf:
                    - $ref: '#/components/schemas/MediaContainer'
                    - type: object
                      properties:
                        ChannelMapping:
                          type: array
                          items:
                            type: object
                            properties:
                              deviceIdentifier:
                                type: string
                                description: The channel description on the device
                              favorite:
                                type: boolean
                              lineupIdentifier:
                                type: string
                                description: The channel identifier in the lineup
                              channelKey:
                                type: string
              examples:
                computedLineup:
                  value:
                    MediaContainer:
                      size: 1
                      ChannelMapping:
                      - channelKey: 5cc83d73af4a72001e9b16d7-5cab3c634df507001fefcad0
                        deviceIdentifier: '48.9'
                        lineupIdentifier: '103'
        '404':
          description: No device or provider with the identifier was found
          content:
            text/html:
              examples:
                notFound:
                  summary: Not Found
                  value: <html><head><title>Not Found</title></head><body><h1>404 Not Found</h1></body></html>
        '500':
          description: Failed to compute channel map
          content:
            text/html:
              examples:
                badParam:
                  summary: Processing failed inside the server
                  value: <html><head><title>Internal Server Error</title></head><body><h1>500 Internal Server Error</h1></body></html>
  /livetv/epg/channels:
    get:
      tags:
      - EPG
      summary: Get channels for a lineup
      description: Get channels for a lineup within an EPG provider
      operationId: livetvEpgGetChannels
      parameters:
      - in: query
        name: lineup
        schema:
          type: string
        required: true
        description: The URI describing the lineup
      responses:
        '200':
          description: OK
          headers:
            X-Plex-Container-Total-Size:
              description: Provided on all MediaContainer objects indicating the total size of objects available
              schema:
                type: integer
            X-Plex-Container-Start:
              description: Provided on all MediaContainer objects indicating the offset of where this container page starts
              schema:
                type: integer
          content:
            application/json:
              schema:
                type: object
                properties:
                  MediaContainer:
                    allOf:
                    - $ref: '#/components/schemas/MediaContainer'
                    - type: object
                      properties:
                        Channel:
                          type: array
                          items:
                            $ref: '#/components/schemas/channel'
              examples:
                someChannels:
                  value:
                    MediaContainer:
                      size: 2
                      Channel:
                      - callSign: BBC1SCO
                        identifier: '001'
                        thumb: http://plex.tmsimg.com/h3/NowShowing/21439/s21439_h3_aa.png
                      - callSign: BBC2SCO
                        identifier: '002'
        '404':
          description: No provider with the identifier was found
          content:
            text/html:
              examples:
                notFound:
                  summary: Not Found
                  value: <html><head><title>Not Found</title></head><body><h1>404 Not Found</h1></body></html>
  /livetv/epg/countries:
    get:
      tags:
      - EPG
      summary: Get all countries
      description: This endpoint returns a list of countries which EPG data is available for. There are three flavors, as specfied by the `flavor` attribute
      operationId: livetvEpgGetCountries
      responses:
        '200':
          description: OK
          headers:
            X-Plex-Container-Total-Size:
              description: Provided on all MediaContainer objects indicating the total size of objects available
              schema:
                type: integer
            X-Plex-Container-Start:
              description: Provided on all MediaContainer objects indicating the offset of where this container page starts
              schema:
                type: integer
          content:
            application/json:
              schema:
                type: object
                properties:
                  MediaContainer:
                    allOf:
                    - $ref: '#/components/schemas/MediaContainer'
                    - type: object
                      properties:
                        Country:
                          type: array
                          items:
                            type: object
                            properties:
                              key:
                                type: string
                              type:
                                type: string
                              title:
                                type: string
                              code:
                                type: string
                                description: Three letter code
                              language:
                                type: string
                                description: Three letter language code
                              languageTitle:
                                type: string
                                description: The title of the language
                              example:
                                type: string
                              flavor:
                                type: integer
                                enum:
                                - 0
                                - 1
                                - 2
                                description: '- `0`: The country is divided into regions, and following the key will lead to a list of regions.

                                  - `1`: The county is divided by postal codes, and an example code is returned in `example`.

                                  - `2`: The country has a single postal code, returned in `example`.

                                  '
              examples:
                threeCountries:
                  value:
                    MediaContainer:
                      size: 3
                      Country:
                      - key: aia/tv.plex.providers.epg.onconnect/lineups
                        type: country
                        title: Anguilla
                        code: aia
                        language: eng
                        languageTitle: English
                        example: AI-2640
                        flavor: 2
                      - key: atg/tv.plex.providers.epg.onconnect/lineups
                        type: country
                        title: Antigua and Barbuda
                        code: atg
                        language: eng
                        languageTitle: English
                        example: AG
                        flavor: 2
                      - key: arg/tv.plex.providers.epg.onconnect/lineups
                        type: country
                        title: Argentina
                        code: arg
                        language: spa
                        languageTitle: Español
                        example: A4190
                        flavor: 1
  /livetv/epg/countries/{country}/{epgId}/lineups:
    get:
      tags:
      - EPG
      summary: Get lineups for a country via postal code
      description: Returns a list of lineups for a given country, EPG provider and postal code
      operationId: livetvEpgGetCountriesCountryLineups
      parameters:
      - in: path
        name: country
        schema:
          type: string
        description: 3 letter country code
        required: true
      - in: path
        name: epgId
        schema:
          type: string
        description: The `providerIdentifier` of the provider
        required: true
      - in: query
        name: postalCode
        schema:
          type: string
        description: The postal code for the lineups to fetch
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/mediaContainerWithLineup'
              examples:
                aSetOfLineups:
                  value:
                    MediaContainer:
                      size: 3
                      uuid: lineup-group://tv.plex.providers.epg.onconnect/aia/AI-2640
                      Lineup:
                      - uuid: lineup://tv.plex.providers.epg.onconnect/AIA-0000040-DEFAULT#Caribbean%20Cable%20Communications%20-%20Anguilla
                        type: lineup
                        title: Caribbean Cable Communications - Anguilla
                        lineupType: 1
                        location: The Valley
                      - uuid: lineup://tv.plex.providers.epg.onconnect/AIA-0000040-X#Caribbean%20Cable%20Communications%20-%20Anguilla%20-%20Digital
                        type: lineup
                        title: Caribbean Cable Communications - Anguilla - Digital
                        lineupType: 1
                        location: The Valley
                      - uuid: lineup://tv.plex.providers.epg.onconnect/AIA-0002293-X#DirecTV%20Anguilla%20-%20Digital
                        type: lineup
                        title: DirecTV Anguilla - Digital
                        lineupType: 1
                        location: The Valley
        '404':
          description: No provider with the identifier was found
          content:
            text/html:
              examples:
                notFound:
                  summary: Not Found
                  value: <html><head><title>Not Found</title></head><body><h1>404 Not Found</h1></body></html>
  /livetv/epg/countries/{country}/{epgId}/regions:
    get:
      tags:
      - EPG
      summary: Get regions for a country
      description: Get regions for a country within an EPG provider
      operationId: livetvEpgGetCountriesCountryRegions
      parameters:
      - in: path
        name: country
        schema:
          type: string
        description: 3 letter country code
        required: true
      - in: path
        name: epgId
        schema:
          type: string
        description: The `providerIdentifier` of the provider
        required: true
      responses:
        '200':
          description: OK
          headers:
            X-Plex-Container-Total-Size:
              description: Provided on all MediaContainer objects indicating the total size of objects available
              schema:
                type: integer
            X-Plex-Container-Start:
              description: Provided on all MediaContainer objects indicating the offset of where this container page starts
              schema:
                type: integer
          content:
            application/json:
              schema:
                type: object
                properties:
                  MediaContainer:
                    allOf:
                    - $ref: '#/components/schemas/MediaContainer'
                    - type: object
                      properties:
                        Country:
                          type: array
                          items:
                            type: object
                            properties:
                              key:
                                type: string
                              type:
                                type: string
                              title:
                                type: string
                              national:
                                type: boolean
              examples:
                someRegions:
                  value:
                    MediaContainer:
                      size: 2
                      Region:
                      - key: 132718/lineups
                        type: region
                        title: Bruxelles
                      - key: 116043/lineups
                        type: region
                        title: Région wallonne
        '404':
          description: No provider with the identifier was found
          content:
            text/html:
              examples:
                notFound:
                  summary: Not Found
                  value: <html><head><title>Not Found</title></head><body><h1>404 Not Found</h1></body></html>
  /livetv/epg/countries/{country}/{epgId}/regions/{region}/lineups:
    get:
      tags:
      - EPG
      summary: Get lineups for a region
      description: Get lineups for a region within an EPG provider
      operationId: livetvEpgGetCountriesCountryRegionsRegionLineups
      parameters:
      - in: path
        name: country
        schema:
          type: string
        description: 3 letter country code
        required: true
      - in: path
        name: epgId
        schema:
          type: string
        description: The `providerIdentifier` of the provider
        required: true
      - in: path
        name: region
        schema:
          type: string
        description: The region for the lineup
        required: true
      responses:
        '200':
          description: OK
          headers:
            X-Plex-Container-Total-Size:
              description: Provided on all MediaContainer objects indicating the total size of objects available
              schema:
                type: integer
            X-Plex-Container-Start:
              description: Provided on all MediaContainer objects indicating the offset of where this container page starts
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/mediaContainerWithLineup'
              examples:
                aSetOfLineups:
                  value:
                    MediaContainer:
                      size: 1
                      uuid: lineup-group://tv.plex.providers.epg.eyeq/bhr/134535
                      Lineup:
                      - uuid: lineup://tv.plex.providers.epg.eyeq/410357488-CE9BE5630D077FE397F3B42E984AC8DD/bhr#OSN
                        type: lineup
                        title: OSN
                        lineupType: 2
        '404':
          description: No provider with the identifier was found
          content:
            text/html:
              examples:
                notFound:
                  summary: Not Found
                  value: <html><head><title>Not Found</title></head><body><h1>404 Not Found</h1></body></html>
  /livetv/epg/languages:
    get:
      tags:
      - EPG
      summary: Get all languages
      description: Returns a list of all possible languages for EPG data.
      operationId: livetvEpgGetLanguages
      responses:
        '200':
          description: OK
          headers:
            X-Plex-Container-Total-Size:
              description: Provided on all MediaContainer objects indicating the total size of objects available
              schema:
                type: integer
            X-Plex-Container-Start:
              description: Provided on all MediaContainer objects indicating the offset of where this container page starts
              schema:
                type: integer
          content:
            application/json:
              schema:
                type: object
                properties:
                  MediaContainer:
                    allOf:
                    - $ref: '#/components/schemas/MediaContainer'
                    - type: object
                      properties:
                        Language:
                          type: array
                          items:
                            type: object
                            properties:
                              code:
                                type: string
                                description: 3 letter language code
                              title:
                                type: string
              examples:
                threeLanguages:
                  value:
                    MediaContainer:
                      size: 3
                      Language:
                      - code: aar
                        title: Afaraf
                      - code: abk
                        title: аҧсуа
                      - code: afr
                        title: Afrikaans
  /livetv/epg/lineup:
    get:
      tags:
      - EPG
      summary: Compute the best lineup
      description: Compute the best lineup, given lineup group and device
      operationId: livetvEpgGetLineup
      parameters:
      - in: query
        name: device
        schema:
          type: string
        required: true
        description: The URI describing the device
      - in: query
        name: lineupGroup
        schema:
          type: string
        required: true
        description: The URI describing the lineupGroup
      responses:
        '200':
          description: OK
          headers:
            X-Plex-Activity:
              schema:
                type: string
              description: The activity of the reload process
        '404':
          description: No device or provider with the identifier was found
          content:
            text/html:
              examples:
                notFound:
                  summary: Not Found
                  value: <html><head><title>Not Found</title></head><body><h1>404 Not Found</h1></body></html>
        '500':
          description: Could not get device's channels
          content:
            text/html:
              examples:
                badParam:
                  summary: Processing failed inside the server
                  value: <html><head><title>Internal Server Error</title></head><body><h1>500 Internal Server Error</h1></body></html>
  /livetv/epg/lineupchannels:
    get:
      tags:
      - EPG
      summary: Get the channels for mulitple lineups
      description: Get the channels across multiple lineups
      operationId: livetvEpgGetLineupchannels
      parameters:
      - in: query
        name: lineup
        schema:
          type: array
          items:
            type: string
        required: true
        description: The URIs describing the lineups
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  MediaContainer:
                    allOf:
                    - $ref: '#/components/schemas/MediaContainer'
                    - type: object
                      properties:
                        Lineup:
                          type: array
                          items:
                            allOf:
                            - $ref: '#/components/schemas/Lineup-items'
                            - type: object
                              properties:
                                Channel:
                                  type: array
                                  items:
                                    $ref: '#/components/schemas/channel'
              examples:
                aChannelSet:
                  description: A lineup channels
                  value:
                    MediaContainer:
                      size: 1
                      Lineup:
                      - uuid: lineup://tv.plex.providers.epg.cloud/0123456789abcdef01234567
                        type: lineup
                        lineupType: -1
                        Channel:
                        - key: 0123456789abcdef01234567-5cab3c634df507001fefcad0
                          channelVcn: '001'
                          title: WINS
                          callSign: WINS
                          language: en
        '404':
          description: No provider with the identifier was found
          content:
            text/html:
              examples:
                notFound:
                  summary: Not Found
                  value: <html><head><title>Not Found</title></head><body><h1>404 Not Found</h1></body></html>
  /tv.plex.providers.epg.{identifier}:{deviceId}/lineups/dvr/channels:
    get:
      tags:
      - EPG
      summary: Get channels for a lineup
      description: Get channels for a lineup within an EPG provider
      operationId: mediaProviderEpgChannels
      parameters:
      - in: path
        name: deviceId
        schema:
          type: integer
        required: true
        description: The device's Identifier
      - in: query
        name: genre
        schema:
          type: string
        required: false
        description: The genre of channels to fetch
      - in: path
        name: identifier
        schema:
          type: string
          enum:
          - xmltv
          - cloud
          - custom
        example: cloud
        required: true
        description: The type of EPG
      responses:
        '200':
          description: OK
          headers:
            X-Plex-Container-Total-Size:
              description: Provided on all MediaContainer objects indicating the total size of objects available
              schema:
                type: integer
            X-Plex-Container-Start:
              description: Provided on all MediaContainer objects indicating the offset of where this container page starts
              schema:
                type: integer
          content:
            application/json:
              schema:
                type: object
                properties:
                  MediaContainer:
                    allOf:
                    - $ref: '#/components/schemas/MediaContainer'
                    - type: object
                      properties:
                        Channel:
                          type: array
                          items:
                            type: object
                            properties:
                              id:
                                type: string
                              gridKey:
                                type: string
                              vcn:
                                type: string
                              isHd:
                                type: boolean
                              thumb:
                                type: string
                              title:
                                type: string
                              callSign:
                                type: string
                              language:
                                type: string
              examples:
                someChannels:
                  value:
                    MediaContainer:
                      size: 3
                      Channel:
                      - id: 5fc76bd6d783b6002d898b76-5fc705db8aba71002d8b78b9
                        gridKey: 5fc76bd6d783b6002d898b76-5fc705db8aba71002d8b78b9
