                        title: getTV
                        callSign: WGCECD3
                        language: en
        '404':
          description: No provider with the identifier was found
          content:
            text/html:
              examples:
                notFound:
                  summary: Not Found
                  value: <html><head><title>Not Found</title></head><body><h1>404 Not Found</h1></body></html>
  /tv.plex.providers.epg.{identifier}:{deviceId}/grid:
    get:
      tags:
      - EPG
      summary: Get airing information
      description: Get the airing information for a given channel on a given day
      operationId: mediaProviderEpgGrid
      parameters:
      - in: query
        name: channelGridKey
        schema:
          type: string
        required: true
        description: The key of the channel on which to get airing information
      - in: query
        name: date
        schema:
          type: string
          format: date
          example: '2023-01-15'
        required: true
        description: The date on which to get airing information
      - in: path
        name: deviceId
        schema:
          type: integer
        required: true
        description: The device's Identifier
      - in: path
        name: identifier
        schema:
          type: string
          enum:
          - xmltv
          - cloud
          - custom
        example: cloud
        required: true
        description: The type of EPG
      responses:
        '200':
          description: OK
          headers:
            X-Plex-Container-Total-Size:
              description: Provided on all MediaContainer objects indicating the total size of objects available
              schema:
                type: integer
            X-Plex-Container-Start:
