          description: OK
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        '404':
          description: Either the media item or the chapter image was not found
          content:
            text/html:
              examples:
                notFound:
                  summary: Not Found
                  value: <html><head><title>Not Found</title></head><body><h1>404 Not Found</h1></body></html>
