components:
  parameters:
    composite:
      in: query
      name: composite
      schema:
        type: object
        properties:
          rows:
            type: integer
            description: Number of rows to construct in the composite image
          cols:
            type: integer
            description: Number of columns to construct in the composite image
          width:
            type: integer
            description: The width of the image
          height:
            type: integer
            description: The height of the image
          border:
            type: integer
            description: The width of the intra-image border
          type:
            type: integer
            description: Limit composite to specified metadata types
          format:
            type: string
            enum:
            - jpg
            - png
            description: The image type
          crop:
            type: string
            enum:
            - center
            - top
            description: Where to crop source images to fit into composite image proportions
          repeat:
            type: boolean
            description: Allow repetion of images if there are not enough source images to fill grid
          media:
            type: string
            enum:
            - thumb
            - art
            - banner
            description: The default image type to use as the sources
          backgroundColor:
            type: string
            description: 6 character hex RGB value for background color for image
      examples:
        default:
          description: The default parameters if none are provided
          value:
            rows: 2
            cols: 2
            width: 512
            height: 512
            border: 0
            type: -1
            format: jpg
            crop: center
            repeat: true
            media: thumb
            backgroundColor: 0
        smallerImage:
          description: Get a composite image in a smaller size
          value:
            height: 256
            width: 256
    mediaQuery:
      in: query
      name: mediaQuery
      schema:
        type: object
      examples:
        simplyAnd:
          description: Represents type = 4 AND sourceType = 2 AND title = "24"
          value:
            type: 4
            sourceType: 2
            title=: 24
        sorting:
          description: Represents type = 4 AND sourceType = 2 AND title IS \"24\" sort by duration in descending order and index (ascending)"
          value:
            type: 4
            sourceType: 2
            title=: 24
            sort:
            - duration:desc
            - index
        implicitOr:
          description: Represents (rating=1 OR rating=2 OR rating=3) AND index=5
          value:
            rating:
            - 1
            - 2
            - 3
            index: 5
        complex:
          description: Represents (index = 1 OR rating = 2) AND duration = 10
          value:
            push: 1
            index: 1
            or: 1
            rating: 2
            pop: 1
            duration: 10
      description: This is a complex query built of several parameters.  See [API Info section](#section/API-Info/Media-Queries) for information on building media queries
  schemas:
    hub:
      type: object
      properties:
        context:
          type: string
          example: hub.home.onDeck
        hubIdentifier:
          type: string
          description: A unique identifier for the hub
          example: home.onDeck
        hubKey:
          type: string
          description: 'A key at which the exact content currently displayed can be fetched again. This is particularly important when a hub is marked as random and requesting the `key` may get different results. It''s otherwise optional.

            '
        key:
          type: string
          description: The key at which all of the content for this hub can be retrieved
          example: /hubs/sections/home/onDeck
        more:
          type: boolean
          description: '"A boolean indicating that the hub contains more than what''s included in the current response."

            '
        size:
          type: integer
          example: 1
        totalSize:
          type: integer
          example: 8
        type:
          type: string
          description: The type of the items contained in this hub, or possibly `mixed` if there are multiple types
          example: track
        subtype:
          type: string
          description: The subtype of the items contained in this hub, or possibly `mixed` if there are multiple types
          example: podcast
        promoted:
          type: boolean
          description: Indicating if the hub should be promoted to the user's homescreen
        random:
          type: boolean
          description: Indicating that the contents of the hub may change on each request
        style:
          type: string
          description: A suggestion on how this hub's contents might be displayed by a client. Some examples include `hero`, `list`, `spotlight`, and `upsell`
        title:
          type: string
          description: A title for this grouping of content
        Metadata:
          type: array
          items:
            $ref: '#/components/schemas/metadata'
      additionalProperties: true
    items:
      type: object
      allOf:
      - $ref: '#/components/schemas/metadata'
      - type: object
        properties:
          MetadataItem:
            type: array
            items:
              type: object
              description: Nested metadata items
              $ref: '#/components/schemas/items'
    part:
      description: '`Part` represents a particular file or "part" of a media item. The part is the playable unit of the media hierarchy. Suppose that a movie library contains a movie that is broken up into files, reminiscent of a movie split across two BDs. The metadata item represents information about the movie, the media item represents this instance of the movie at this resolution and quality, and the part items represent the two playable files.  If another media were added which contained the joining of these two parts transcoded down to a lower resolution, then this metadata would contain 2 medias, one with 2 parts and one with 1 part.

        '
      type: object
      properties:
        audioProfile:
          example: lc
        container:
          description: The container of the media file, such as `mp4` or `mkv`
          example: mov
        duration:
          type: integer
          description: The duration of the media item, in milliseconds
          example: 150192
        file:
          description: The local file path at which the part is stored on the server
          example: /home/schuyler/Videos/Trailers/Cloud Atlas (2012).mov
        has64bitOffsets:
          type: boolean
          example: false
        id:
          type: integer
          example: 1
        key:
          description: The key from which the media can be streamed
          example: /library/parts/1/1531779263/file.mov
        optimizedForStreaming:
          type: boolean
          example: false
        size:
          type: integer
          description: The size of the media, in bytes
          example: 105355654
        videoProfile:
          example: main
        Stream:
          type: array
          items:
            $ref: '#/components/schemas/stream'
      additionalProperties: true
    filter:
      allOf:
      - $ref: '#/components/schemas/directory'
