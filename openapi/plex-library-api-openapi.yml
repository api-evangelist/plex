      summary: Unmatch a metadata item
      description: Unmatch a metadata item to info fetched from the agent
      parameters:
      - in: path
        name: ids
        schema:
          type: string
        required: true
      responses:
        '200':
          $ref: '#/components/responses/200'
  /library/metadata/{ids}/users/top:
    get:
      tags:
      - Library
      security:
      - user_token:
        - admin
      operationId: libraryMetadataGetUsersTop
      summary: Get metadata top users
      description: Get the list of users which have played this item starting with the most
      parameters:
      - in: path
        name: ids
        schema:
          type: string
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  MediaContainer:
                    allOf:
                    - $ref: '#/components/schemas/MediaContainer'
                    - type: object
                      properties:
                        Account:
                          type: array
                          items:
                            type: object
                            properties:
                              id:
                                type: integer
                              globalViewCount:
                                type: integer
              examples:
                users:
                  value:
                    MediaContainer:
                      size: 2
                      Account:
                      - id: 1
                        globalViewCount: 3
                      - id: 12345
                        globalViewCount: 2
