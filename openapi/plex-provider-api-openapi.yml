openapi: 3.2.0
info:
  title: Plex Media Server Provider API
  version: '1.2.2

    '
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  description: '# API Info

    ## Content Types

    The API supports responses in both XML and JSON, and clients can request one or the other using the standard `Accept` HTTP header.'
servers:
- url: https://{IP-description}.{identifier}.plex.direct:{port}
  variables:
    IP-description:
      default: 1-2-3-4
      description: A `-` separated string of the IPv4 or IPv6 address components
    identifier:
      default: 0123456789abcdef0123456789abcdef
      description: The unique identifier of this particular PMS
    port:
      default: '32400'
security:
- user_token:
  - shared user
  - admin
tags:
- name: Provider
  description: Media providers are the starting points for the entire Plex Media Server media library API. It defines the paths for the groups of endpoints. The `/media/providers` should be the only hard-coded path in clients when accessing the media library. Non-media library endpoints are outside the scope of the media provider. See the description in See the section in API Info for more information on how to use media providers.
paths:
  /media/providers:
    get:
      tags:
      - Provider
      operationId: getMediaProviders
      summary: Get the list of available media providers
      description: Get the list of all available media providers for this PMS. This will generally include the library provider and possibly EPG if DVR is set up.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  MediaContainer:
                    allOf:
                    - $ref: '#/components/schemas/serverConfiguration'
                    - type: object
                      properties:
                        identifier:
                          type: string
                          description: A unique identifier for the provider, e.g. `com.plexapp.plugins.library`.
                        title:
                          type: string
                          description: The title of the provider.
                        types:
                          type: string
                          description: This attribute contains a comma-separated list of the media types exposed by the provider (e.g. `video, audio`).
                        protocols:
                          type: string
                          description: 'A comma-separated list of default protocols for the provider, which can be:

                            - `stream`: The provider allows streaming media directly from the provider (e.g. for Vimeo). - `download`: The provider allows downloading media for offline storage, sync, etc. (e.g. Podcasts). - `livetv`: The provider provides live content which is only available on a schedule basis.'
                        Feature:
                          type: array
                          items:
                            type: object
                            properties:
                              key:
                                type: string
                              type:
                                type: string
                              Directory:
                                type: array
                                items:
                                  $ref: '#/components/schemas/directory'
              examples:
                providerWithEpg:
                  summary: Media providers including EPG
                  value:
                    MediaContainer:
                      size: 2
                      allowCameraUpload: true
                      allowChannelAccess: true
                      allowMediaDeletion: true
                      allowSharing: true
                      allowSync: true
                      allowTuners: true
                      backgroundProcessing: true
                      certificate: true
