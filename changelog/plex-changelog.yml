- version: 1.2.2
  requires: PMS >= 1.43.2
  breaking: false
  additions:
  - Added audioLayout endpoint (PM-5118).
  - Added videoCodec, audioCodec and subtitleCodec endpoints (PM-5117).
- version: 1.2.1
  requires: PMS >= 1.43.1
  breaking: false
  additions:
  - Added /tv.plex.providers.epg.{identifier}:{deviceId} endpoints (PM-4017).
