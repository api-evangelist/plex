- version: 1.2.0
  requires: PMS >= 1.43.0
  breaking: false
  additions:
  - Added squareArt as an additional element type for image assets (PM-2959).
  - Added /media/providers/metadata endpoints (PM-1012).
  - Added a delete method for /library/metadata/{id}/{element} (PM-4094).
  - Documented Metadata-type Media Providers (PM-3051).
- version: 1.1.1
  requires: PMS >= 1.42.2
  breaking: false
  additions:
  - Added the metadataAgentProviderGroupId query parameter to create and edit
    library section (PM-3577).
  fixes:
  - Fixed the Add library section method type.
- version: 1.1.0
  requires: PMS >= 1.42.0
  breaking: true
  additions:
  - Added the ability to filter the /media/providers/metadata endpoint by metadata
    types (PM-3702).
  - Documented the /photo/:/transcode endpoints.
  changes:
  - 'BREAKING: types in /playlists/{playlistId}/items changed to an array of
    integers.'
  fixes:
  - Fixed serialization of MetadataType objects for /media/providers/metadata
    calls.
- version: 1.0.0
  requires: PMS >= 1.41.9
  breaking: true
  highlights:
  - First public release of the Plex Media Server API documentation.
  additions:
  - Added /downloadQueue endpoints.
  changes:
  - 'BREAKING: includeFields renamed to includeOptionalFields. includeFields now
    means "include only these fields", where previously it meant "add these fields
    you would not normally include". Changed for consistency with the cloud provider
    API.'
