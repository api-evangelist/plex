aid: plex
name: Plex
description: 'Plex, Inc. is a personal-media and streaming company whose Plex Media
  Server organizes, transcodes and streams a user''s own movies, TV, music and photos
  to Plex client apps on virtually every platform, alongside a free ad-supported live
  TV and on-demand catalog, Discover, Rentals, the Plexamp music player and the paid
  Plex Pass tier. In September 2025 Plex published official documentation for the
  Plex Media Server HTTP API for the first time — an OpenAPI 3.1 contract covering
  libraries, metadata, playlists, play queues, sessions, DVR/Live TV, transcoding
  and server administration — together with a new public-key JWT authentication flow
  on plex.tv, Plex Pass webhooks, and an OAuth-protected remote MCP server for agents.'
