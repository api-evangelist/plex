- aid: plex:plex-account-api
  name: Plex Account and Authentication API
  description: >-
    The plex.tv cloud API that issues and refreshes the credentials every Plex Media Server call depends
    on: PIN-based device linking, JWK public-key registration, nonce issuance, device-JWT exchange for
    a 7-day Plex JWT, and the published JWKS. Legacy long-lived X-Plex-Token authentication is still supported.
  humanURL: https://developer.plex.tv/pms/#section/API-Info/Authenticating-with-Plex
  baseURL: https://clients.plex.tv/api/v2
  tags:
  - Authentication
