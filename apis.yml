    url: https://developer.plex.tv/pms/#section/API-Info/Authenticating-with-Plex
- aid: plex:plex-mcp-server
  name: Plex MCP Server
  description: >-
    A first-party remote Model Context Protocol server operated by Plex at https://plex.tv/internal/mcp.
    It advertises RFC 9728 protected-resource metadata, RFC 8414 authorization-server metadata and OpenID
    Connect discovery from plex.tv, uses OAuth 2.1 authorization-code with PKCE (S256) and dynamic client
    registration, and requires the single scope "mcp". An anonymous tools/list call returns a JSON-RPC
    Unauthorized error, so the live tool schemas require authenticated introspection.
  humanURL: https://plex.tv/.well-known/oauth-protected-resource
  baseURL: https://plex.tv/internal/mcp
  tags:
  - MCP
  - Agents
  - OAuth
  properties:
  - type: MCPServer
    url: mcp/plex-mcp.yml
  - type: ToolCrosswalk
    url: mcp/plex-tool-crosswalk.yml
  - type: OAuthScopes
    url: scopes/plex-scopes.yml
