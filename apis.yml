- aid: plex:plex-devices-api
  name: Plex Devices API
  description: >-
    Media grabbers provide ways for media to be obtained for a given protocol. The simplest ones are `stream`
    and `download`. More complex grabbers can have associated devices


    Network tuners can present themselves on the network using the Simple Service Discovery Protocol and
    Plex Media Server will discover them. The following XML is an example of the data returned from SSDP.
    The `deviceType`, `serviceType`, and `serviceId` values must remain as they are in the example in
    order for PMS to properly discover the device. Other less-obvious fields are described in the parameters
    section below.


    Example SSDP output

    ```

    <root xmlns="urn:schemas-upnp-org:device-1-0">
        <specVersion>
            <major>1</major>
            <minor>0</minor>
        </specVersion>
        <device>
            <deviceType>urn:plex-tv:device:Media:1</deviceType>
            <friendlyName>Turing Hopper 3000</friendlyName>
            <manufacturer>Plex, Inc.</manufacturer>
            <manufacturerURL>https://plex.tv/</manufacturerURL>
            <modelDescription>Turing Hopper 3000 Media Grabber</modelDescription>
            <modelName>Plex Media Grabber</modelName>
            <modelNumber>1</modelNumber>
            <modelURL>https://plex.tv</modelURL>
            <UDN>uuid:42fde8e4-93b6-41e5-8a63-12d848655811</UDN>
            <serviceList>
                <service>
                    <URLBase>http://10.0.0.5:8088</URLBase>
                    <serviceType>urn:plex-tv:service:MediaGrabber:1</serviceType>
                    <serviceId>urn:plex-tv:serviceId:MediaGrabber</serviceId>
                </service>
            </serviceList>
        </device>
    </root>

    ```

      - UDN: (string) A UUID for the device. This should be unique across models of a device at minimum.
      - URLBase: (string) The base HTTP URL for the device from which all of the other endpoints are hosted.
  humanURL: https://developer.plex.tv/pms/
  baseURL: https://1-2-3-4.0123456789abcdef0123456789abcdef.plex.direct:32400
  tags:
  - Devices
  properties:
  - type: OpenAPI
    url: openapi/plex-devices-api-openapi.yml
  - type: Documentation
    url: https://developer.plex.tv/pms/
  - type: APIReference
    url: https://developer.plex.tv/pms/
