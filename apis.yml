apis:
- aid: plex:plex-media-server-api
  name: Plex Media Server API
  description: 'The official HTTP API exposed by every Plex Media Server. Version
    1.2.2 of the published contract describes 258 operations across 205 paths — library
    sections and items, metadata and artwork, playlists, collections, play queues,
    playback sessions and history, activities, butler maintenance tasks, preferences,
    the download queue, transcoding decisions, DVR/EPG/Live TV, and the notification
    WebSocket and EventSource streams. Responses are XML by default and JSON when
    an Accept: application/json header is sent.'
  humanURL: https://developer.plex.tv/pms/
  baseURL: https://1-2-3-4.0123456789abcdef0123456789abcdef.plex.direct:32400
  x-baseURL-note: 'Plex Media Server is self-hosted. The OpenAPI servers[] entry is
    a templated URL — https://{IP-description}.{identifier}.plex.direct:{port} — where
    the host encodes the server''s IP address and machine identifier under Plex''s
    wildcard TLS domain plex.direct. The value above is that template resolved with
    the spec''s own default variables.'
  tags:
  - Media Server
  - Library
  - Metadata
  - Playlists
  - Live TV
  - DVR
  - Transcoding
  properties:
  - type: OpenAPI
    url: openapi/plex-media-server-openapi.json
  - type: Overlay
    url: overlays/plex-media-server-overlay.yaml
  - type: Documentation
    url: https://developer.plex.tv/pms/
  - type: APIReference
    url: https://developer.plex.tv/pms/
- aid: plex:plex-account-api
  name: Plex Account and Authentication API
  description: 'The plex.tv cloud API that issues and refreshes the credentials every
    Plex Media Server call depends on: PIN-based device linking, JWK public-key registration,
    nonce issuance, device-JWT exchange for a 7-day Plex JWT, and the published JWKS.
    Legacy long-lived X-Plex-Token authentication is still supported.'
  humanURL: https://developer.plex.tv/pms/#section/API-Info/Authenticating-with-Plex
  baseURL: https://clients.plex.tv/api/v2
  tags:
  - Authentication
  - OAuth
  - JWT
  - Identity
  properties:
  - type: Authentication
    url: authentication/plex-authentication.yml
  - type: Documentation
    url: https://developer.plex.tv/pms/#section/API-Info/Authenticating-with-Plex
- aid: plex:plex-mcp-server
  name: Plex MCP Server
  description: 'A first-party remote Model Context Protocol server operated by Plex
    at https://plex.tv/internal/mcp. It advertises RFC 9728 protected-resource metadata,
    RFC 8414 authorization-server metadata and OpenID Connect discovery from plex.tv,
    uses OAuth 2.1 authorization-code with PKCE (S256) and dynamic client registration,
    and requires the single scope "mcp". An anonymous tools/list call returns a JSON-RPC
    Unauthorized error, so the live tool schemas require authenticated introspection.'
  humanURL: https://plex.tv/.well-known/oauth-protected-resource
  baseURL: https://plex.tv/internal/mcp
  tags:
  - MCP
  - Agents
  - OAuth
  properties:
  - type: MCPServer
    url: mcp/plex-mcp.yml
  - type: ToolCrosswalk
    url: mcp/plex-tool-crosswalk.yml
  - type: OAuthScopes
    url: scopes/plex-scopes.yml
