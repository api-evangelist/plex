  update:
    x-apievangelist-gaps:
    - No raw OpenAPI file is served at a stable, linkable URL.
    - Error responses declare text/html or no content; there is no problem+json
      envelope and no machine-readable error code.
    - No idempotency contract is documented for the write operations.
    - No rate-limit headers or published quota are documented.
    - Webhooks are documented in the support knowledge base only, with no AsyncAPI.
